<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Haramain Companion</title>
    <style>
      :root { --bg: #f7f3ea; --fg: #1c2620; --muted: #5c665f; --primary: #0f5c45; --gold: #a9802f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1511; --fg: #ece6d6; --muted: #9aa79f; --primary: #3fae85; --gold: #d6b25e; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
        font-family: "Noto Sans Bengali", system-ui, sans-serif; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; border: 3px solid var(--gold); transform: rotate(45deg); }
      h1 { font-size: 1.3rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 4px 0; line-height: 1.6; }
      a { display: inline-block; margin-top: 20px; padding: 12px 20px; border-radius: 12px; background: var(--primary); color: #fff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>📴 অফলাইন মোড · Offline</h1>
      <p>এই পাতাটি এখনো সংরক্ষিত হয়নি। ইন্টারনেট সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
      <p>This page has not been saved for offline use yet. Please try again when you are back online.</p>
      <a href="/">হোম · Home</a>
    </main>
  </body>
</html>
