name: photon-check
on:
  push:
    branches: [tools/photon-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; mkdir -p photon-data; touch photon-data/codes.txt
          UA="LabbaikGuide/1.0 (place search check)"
          curl -sS -m 30 -A "$UA" "https://photon.komoot.io/api/?q=swissotel&lat=21.4225&lon=39.8262&limit=5&lang=en" -o photon-data/swissotel.json -w "%{http_code}\n" >> photon-data/codes.txt || echo fail1 >> photon-data/codes.txt
          curl -sS -m 30 -A "$UA" "https://photon.komoot.io/api/?q=%D9%81%D9%86%D8%AF%D9%82%20%D8%A7%D9%84%D9%85%D9%8A%D8%B1%D8%A7%D8%AF&lat=21.4225&lon=39.8262&limit=5" -o photon-data/arabic.json -w "%{http_code}\n" >> photon-data/codes.txt || echo fail >> photon-data/codes.txt
          curl -sS -m 30 -A "$UA" "https://photon.komoot.io/api/?q=hilton&lat=21.4225&lon=39.8262&limit=5&lang=en&bbox=39.70,21.30,39.95,21.55" -o photon-data/bbox.json -w "%{http_code}\n" >> photon-data/codes.txt || echo fail >> photon-data/codes.txt
          curl -sS -m 30 -A "$UA" "https://photon.komoot.io/api/?q=ibrahim%20khalil&lat=21.4225&lon=39.8262&limit=5&lang=en" -o photon-data/street.json -w "%{http_code}\n" >> photon-data/codes.txt || echo fail >> photon-data/codes.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add photon-data && git commit -m "photon sample [skip ci]" && git push
