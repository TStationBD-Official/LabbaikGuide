name: ziyarah-data
on:
  push:
    branches: [tools/ziyarah-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node tools/autoplay.mjs 2> zdata/autoplay.err
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add zdata && git commit -m "autoplay check [skip ci]" && git push
