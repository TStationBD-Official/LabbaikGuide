name: ziyarah-data
on:
  push:
    branches: [tools/ziyarah-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; git pull -q origin tools/ziyarah-data
          python3 tools/yt.py 2> zdata/yterr.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add zdata && git commit -m "yt probe [skip ci]" && git push
