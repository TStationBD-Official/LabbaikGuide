name: ziyarah-data
on:
  push:
    branches: [tools/ziyarah-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          curl -s https://labbaikguide.vercel.app/api/live > zdata/live.json
          for id in $(python3 -c "import json;print(' '.join(c['videoId'] or '' for c in json.load(open('zdata/live.json'))['channels']))"); do
            echo "$id $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://i.ytimg.com/vi/$id/hqdefault_live.jpg)" >> zdata/live.json.thumbs
          done
          echo "page $(curl -s -o /dev/null -w '%{http_code}' https://labbaikguide.vercel.app/live)" >> zdata/live.json.thumbs
          curl -sI https://labbaikguide.vercel.app/live | grep -io "img-src[^;]*" >> zdata/live.json.thumbs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add zdata && git commit -m "live check [skip ci]" && git push
