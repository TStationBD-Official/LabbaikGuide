name: ziyarah-data
on:
  push:
    branches: [tools/ziyarah-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          : > zdata/check.txt
          while read u; do echo "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -A 'LabbaikGuide/1.0 (image check)' "$u") $u" >> zdata/check.txt; sleep 1; done < zdata/imgs.txt
          sleep 60
          for p in /ziyarah "/ziyarah?place=taif" /travel-guide; do echo "$(curl -s -o /dev/null -w '%{http_code}' "https://labbaikguide.vercel.app$p") $p" >> zdata/check.txt; done
          curl -sI https://labbaikguide.vercel.app/ziyarah | grep -i content-security | grep -o "img-src[^;]*" >> zdata/check.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add zdata && git commit -m "ziyarah check [skip ci]" && git push
