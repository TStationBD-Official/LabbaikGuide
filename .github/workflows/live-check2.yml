name: live-check2
on:
  push:
    branches: [tools/live-check2]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; mkdir -p live-data
          B=https://labbaikguide.vercel.app
          curl -sS -m 40 "$B/api/places/resolve?url=https%3A%2F%2Fmaps.app.goo.gl%2FAY1kTJQ4VVsLQnKr5%3Fg_st%3Dac&loc=makkah&lang=en" -o live-data/resolve.json -w "%{http_code}\n" >> live-data/codes.txt
          curl -sS -m 40 "$B/api/places/search?q=bader&loc=makkah&lang=en" -o live-data/bader.json -w "%{http_code}\n" >> live-data/codes.txt
          curl -sS -m 40 "$B/api/places/search?q=%D8%A8%D8%AF%D8%B1&loc=makkah&lang=en" -o live-data/bader-ar.json -w "%{http_code}\n" >> live-data/codes.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add live-data && git commit -m "live sample [skip ci]" && git push
