name: osm-fetch
on:
  push:
    branches: [tools/osm-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass for Masjid al-Haram gates
        run: |
          cat > q.txt <<'Q'
          [out:json][timeout:90];
          way(around:150,21.4225,39.8262)["amenity"="place_of_worship"]->.m;
          rel(around:150,21.4225,39.8262)["amenity"="place_of_worship"]->.r;
          (.m; .r; way(r.r););
          out tags geom;
          (
            node(around:700,21.4225,39.8262)["entrance"];
            node(around:700,21.4225,39.8262)["door"];
            node(around:700,21.4225,39.8262)["barrier"="gate"];
            nwr(around:700,21.4225,39.8262)["name"~"باب|بوابة|Gate|Bab|Door",i];
            nwr(around:700,21.4225,39.8262)["ref"]["building"!~"."];
          );
          out center tags;
          Q
          : > log.txt
          for attempt in 1 2 3; do
            for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
              code=$(curl -sS -m 150 -A "LabbaikGuide/1.0 (gate data check)" --data-urlencode data@q.txt "$u" -o out.json -w "%{http_code}" || echo ERR)
              echo "$attempt $u -> $code $(head -c 120 out.json | tr '\n' ' ')" >> log.txt
              if [ "$code" = "200" ] && python3 -c "import json;json.load(open('out.json'))['elements']"; then mv out.json haram.json; break 2; fi
              sleep 5
            done
          done
          touch haram.json
          ls -la haram.json
      - name: Commit result
        run: |
          mkdir -p osm-data && mv haram.json osm-data/haram.json && mv log.txt osm-data/log.txt && rm -f q.txt out.json
          git config user.name "osm-fetch" && git config user.email "osm-fetch@users.noreply.github.com"
          git add osm-data && git commit -m "osm-data: Haram gates snapshot [skip ci]" && git push
